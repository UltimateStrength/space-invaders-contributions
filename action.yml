name: "space-invaders-contributions"
description: "Turns your GitHub contribution graph into a space invaders animation: a ship blasts each contribution square, in the order you made it. Outputs an animated SVG."
author: "UltimateStrength"

branding:
  icon: "zap"
  color: "purple"

runs:
  using: node24
  main: packages/action/dist/index.js

inputs:
  github_user_name:
    description: "github user name"
    required: true
  github_token:
    description: "github token used to fetch the contribution calendar. Default to the action token if empty."
    required: false
    default: ${{ github.token }}
  outputs:
    required: false
    description: |
      list of files to generate.
      one file per line. Each output can be customized with options as query string.

       supported query string options:

      - palette:      A preset of color, one of [github, github-dark, github-light]
      - color_ship:   Color of the ship and its lasers
      - color_dots:   Coma separated list of dots color.
                      The first one is 0 contribution, then it goes from the low contribution to the highest.
                      Exactly 5 colors are expected.
      example:
        outputs: |
          dark.svg?palette=github-dark&color_ship=blue
          light.svg?color_ship=#7845ab
          ocean.svg?color_ship=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
