name: manual run

on:
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile

      - name: build the action
        run: npm run build:action

      - name: generate the space invaders animation
        uses: ./
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/space-invaders-contributions.svg
            dist/space-invaders-contributions-dark.svg?palette=github-dark
            dist/space-invaders-contributions-blue.svg?color_ship=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: ensure the generated file exists
        run: |
          ls dist
          test -f dist/space-invaders-contributions.svg
          test -f dist/space-invaders-contributions-dark.svg
          test -f dist/space-invaders-contributions-blue.svg

      - name: push the generated files to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: manual-run-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
